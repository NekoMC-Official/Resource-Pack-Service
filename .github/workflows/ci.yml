name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pack tool tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/rps-pack
      - name: Normalize wrapper
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew
      - name: Rust tests
        run: cargo test --manifest-path rust/rps-pack/Cargo.toml
      - name: Check Windows target
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --manifest-path rust/rps-pack/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build plugin jar
        run: |
          cargo build --release --manifest-path rust/rps-pack/Cargo.toml
          RPS_PACK_BIN="$PWD/rust/rps-pack/target/release/rps-pack" ./gradlew build --no-daemon
      - name: Assert bundled merger
        run: |
          python3 -c "import glob,sys,zipfile; jars=[j for j in glob.glob('paper/build/libs/resource-pack-service-*.jar')+glob.glob('fabric/build/libs/resource-pack-service-fabric-*.jar') if not j.endswith('-plain.jar')]; sys.exit('没有匹配到任何待发布 jar') if not jars else None; bad=[j for j in jars if not [n for n in zipfile.ZipFile(j).namelist() if n.startswith('rps-pack/bin/rps-pack')]]; print('缺少内置合并器:', bad) if bad else print('内置合并器已随包:', len(jars), '个 jar'); sys.exit(1 if bad else 0)"
      - name: Assert jar sizes
        run: python3 tools/check_jar_size.py
      - name: Upload Paper jar
        uses: actions/upload-artifact@v7
        with:
          name: resource-pack-service-paper-linux-x86_64
          path: paper/build/libs/resource-pack-service-*.jar
          if-no-files-found: error
      - name: Upload Fabric jar
        uses: actions/upload-artifact@v7
        with:
          name: resource-pack-service-fabric-linux-x86_64
          path: fabric/build/libs/resource-pack-service-fabric-*.jar
          if-no-files-found: error