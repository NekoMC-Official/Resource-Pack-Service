name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签，例如 v0.1.0'
        required: true
      platform:
        description: '目标平台'
        type: choice
        options: [linux-x86_64, windows-x86_64]
        default: linux-x86_64
        variant:
          description: '产物类型'
          type: choice
          options: [paper, fabric]
          default: paper

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*-${{ inputs.platform }}.jar" \
            --dir dist
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Copy jar (no restart)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DIR: ${{ secrets.DEPLOY_PLUGINS_DIR }}
          VARIANT: ${{ inputs.variant }}
        run: |
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          if [ "$VARIANT" = "fabric" ]; then
            SRC="$(ls dist/resource-pack-service-fabric-*.jar | head -n1)"
            NAME=resource-pack-service-fabric.jar
          else
            SRC="$(ls dist/resource-pack-service-[0-9]*.jar | head -n1)"
            NAME=resource-pack-service.jar
          fi
          scp "$SRC" "$USER@$HOST:$DIR/$NAME.new"
          ssh "$USER@$HOST" "cd '$DIR' && if [ -f $NAME ]; then cp $NAME $NAME.bak-\$(date +%Y%m%d%H%M%S); fi && mv $NAME.new $NAME && sha256sum $NAME"
      - name: Reminder
        run: echo '已投递但未重启：按部署流程在维护窗口 COLD 重启，先跑 /rps check。'