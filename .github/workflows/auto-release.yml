name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - "packs/**"
      - "src/**"
      - "rust/**"
      - "build.gradle.kts"
      - "tools/packs.py"
      - ".github/workflows/auto-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'dependabot[bot]' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Normalize wrapper
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: zulu
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/rps-pack

      - name: Decide version
        id: version
        run: |
          git fetch --tags --force
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            VERSION="0.1.0"
          else
            BASE="${LATEST#v}"
            MAJOR="${BASE%%.*}"
            REST="${BASE#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST##*.}"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "previous=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build -Pversion="${VERSION}" --no-daemon

      - name: Build community pack
        if: hashFiles('packs/*/pack.yml') != ''
        run: |
          cargo build --release --manifest-path rust/rps-pack/Cargo.toml
          python tools/packs.py build --root packs --out build/packs
          python tools/packs.py merge \
            --packs build/packs \
            --binary rust/rps-pack/target/release/rps-pack \
            --out build/community-pack.zip \
            --report build/community-pack.report.json \
            --summary build/pack-summary.md

      - name: Compose release notes
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "版本 ${VERSION}"
            echo
            echo "## 变更"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --pretty=format:'- %s (%h)' "${PREVIOUS}..HEAD"
            else
              git log -20 --pretty=format:'- %s (%h)'
            fi
            echo
            if [ -f build/pack-summary.md ]; then
              echo
              cat build/pack-summary.md
            fi
          } > build/release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          ASSETS=("build/libs/resource-pack-service.jar")
          if [ -f build/community-pack.zip ]; then
            ASSETS+=("build/community-pack.zip")
            ASSETS+=("build/community-pack.report.json")
          fi
          if [ -f build/pack-summary.md ]; then
            ASSETS+=("build/pack-summary.md")
          fi
          gh release create "${TAG}" "${ASSETS[@]}" \
            --target "${TARGET}" \
            --title "Resource Pack Service ${VERSION}" \
            --notes-file build/release-notes.md
