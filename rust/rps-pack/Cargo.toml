[package]
name = "rps-pack"
version = "0.1.0"
edition = "2024"
description = "Resource pack merger for the NekoMC Folia server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
opt-level = 3
lto = true
strip = true
