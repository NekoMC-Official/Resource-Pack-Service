name: Resource Pack Service
version: '${version}'
main: moe.nekomc.resourcepack.ResourcePackServicePlugin
api-version: '26.3'
folia-supported: true
authors: [NekoMC]
description: 把多个插件的资源包合成一份，由本插件自己通过内置 HTTP 出口下发

commands:
  rps:
    description: 资源包合成与下发管理
    usage: /rps help
    permission: rps.use

permissions:
  rps.*:
    description: 资源包服务的全部权限
    default: op
    children:
      rps.use: true
      rps.status: true
      rps.list: true
      rps.diff: true
      rps.check: true
      rps.build: true
      rps.reload: true
      rps.push: true
  rps.use:
    description: 允许使用 /rps；普通玩家可 /rps push 给自己重载
    default: true
  rps.status:
    description: 查看合成包状态
    default: op
  rps.list:
    description: 查看已登记来源
    default: op
  rps.diff:
    description: 查看条目差异
    default: op
  rps.check:
    description: 检查下发环境
    default: op
  rps.build:
    description: 触发一次合成
    default: op
  rps.reload:
    description: 重载配置
    default: op
  rps.push:
    description: 手动推送资源包
    default: op
  rps.admin:
    description: 管理组，含 build/reload/push/check
    default: op
    children:
      rps.build: true
      rps.reload: true
      rps.push: true
      rps.check: true
