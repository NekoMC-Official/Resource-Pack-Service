# 资源包服务配置
provider:
  # 资源包是否必装：true 时客户端拒绝会断开连接
  required: false
  # 客户端看到的一句提示
  prompt: ""

merge:
  policy: override
  rust:
    # rps-pack 可执行文件；留空或找不到时用 jar 内置的那份
    binary: "bin/rps-pack"
    timeout-ms: 60000
  json-merge: true
  # auto 表示交给 rps-pack 自己判断；也可写 15 / 34 这种具体格式号
  pack-format: auto
  max-bytes: 104857600
  description: "NekoMC 统一资源包"

output:
  dir: "merged"

# 本插件自己的下发通道，不依赖其它插件
delivery:
  # 玩家进服后延迟多少 tick 推送，1 表示下一 tick
  join-delay-ticks: 1
  # 是否把客户端进度（加载成功/拒绝）回显给玩家
  status-feedback: true
  http:
    # 内置下载出口；关掉就必须手工填 public-url
    enabled: true
    bind: 0.0.0.0
    port: 25580
    path: /pack/merged.zip
    # 公网地址；填了就以它为准，适合放在反向代理后面
    public-url: ""

community:
  # 社区资源包目录：由发布包里的 community-packs.zip 解压得到
  enabled: true
  dir: "plugins/Resource Pack Service/community"
  # 社区包在合成时的层序偏移；具体包的 priority 会叠加在它上面
  priority: 0
  # 服务端 Minecraft 版本（如 1.21.8）；空串表示不额外限制版本，由各包的 minecraft 范围决定
  minecraft: ""
  # 服务端资源包格式；留空沿用 merge.pack-format 的具体数字，0 表示不按格式过滤
  pack-format: ""
  # 远程索引：从 GitHub Pages 拉取社区包清单，只下载本机已安装插件对应的包
  remote:
    enabled: false
    index-url: "https://nekomc-official.github.io/Resource-Pack-Service/community-index.json"
    interval-minutes: 60
    timeout-ms: 30000
    max-pack-bytes: 67108864
    require-https: true
    pin-sha1: ""

sources:
  - id: "bettermodel/base"
    enabled: true
    path: "plugins/BetterModel/build.zip"
    priority: -100
    namespaces:
      - "bettermodel"

watch:
  enabled: true
  interval-seconds: 60

push:
  # none 只落盘；notify 提示玩家点击下载；force 直接强制重推
  mode: "notify"
  notify-message: "<gold>资源包已更新，<click:run_command:'/rps push'><u>点这里重新下载</u></click></gold>"
