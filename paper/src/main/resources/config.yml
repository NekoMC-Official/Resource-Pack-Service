# 资源包服务配置
provider:
  # 服务端强制策略：true 时玩家拒绝资源包（DECLINED）会按 reject-message 断开。
  # 它不改变客户端弹什么框：客户端是否弹窗由玩家在该服务器条目的
  # 「Server Resource Packs」（提示 / 已启用 / 已禁用）决定。档位为「已禁用」且
  # announce-required=false 时，客户端不弹窗、静默回 DECLINED，然后被这里断开。
  # 对所有来源、所有玩家、所有推送路径生效；false 时玩家下次进服仍会再推。
  required: false
  # 是否把“必需”标记随资源包发给客户端；不写＝跟随 required，显式 true/false 覆盖。
  # true：客户端即使档位为「已禁用」也会弹必装框（Proceed / Disconnect），
  #       拒绝时客户端先用它自己的文案断开，reject-message 只作服务端兜底。
  # false：客户端一律当可选包（Yes/No），拒绝后由 required 决定是否断开。
  # announce-required: false
  # 客户端看到的一句提示
  prompt: ""
  # required 或 announce-required 生效时客户端拒绝的断开原因（MiniMessage）；留空使用内置自解释文案
  reject-message: ""

merge:
  policy: override
  rust:
    # rps-pack 可执行文件；留空或找不到时用 jar 内置的那份
    binary: "bin/rps-pack"
    timeout-ms: 60000
  json-merge: true
  # auto 表示交给 rps-pack 自己判断；也可写 15 / 34 这种具体格式号
  pack-format: auto
  max-bytes: 104857600
  description: "NekoMC 统一资源包"

output:
  dir: "merged"

# 本插件自己的下发通道，不依赖其它插件
delivery:
  # 玩家进服后延迟多少 tick 推送，1 表示下一 tick
  join-delay-ticks: 1
  # 海量推送：并发窗口与排队策略（上千人同时在线也不会一次性全部发出）
  fanout:
    # 同一时刻最多有多少个下载在进行，进度回执会释放窗口
    max-concurrent: 64
    # 进服推送的随机延迟上限，避免整服同时拉包
    jitter-ms: 1500
    # 下载失败后重试次数（客户端明确拒绝不重试）
    retry: 1
    # 每 5 秒按失败率升降窗口（>2% 减半、<1% 放大），关闭时直接用上限
    ramp: true
  # 是否把客户端进度（加载成功/拒绝）回显给玩家
  status-feedback: true
  http:
    # 内置下载出口；关掉就必须手工填 public-url
    enabled: true
    bind: 0.0.0.0
    port: 25580
    path: /pack/merged.zip
    # 同时在途的下载上限（1-256）；占满时新请求直接 503（配合推送窗口，别让整服一起拉包）
    max-concurrent: 64
    # 出口全局限速（KB/s，0-10000000，0 表示不限）；多人同时下载时按带宽封顶
    egress-kbps: 0
    # 公网地址；填了就以它为准，适合放在反向代理后面
    public-url: ""

community:
  # 社区资源包目录：由发布包里的 community-packs.zip 解压得到
  enabled: true
  # dir: "plugins/ResourcePackService/community"  # 缺省：Paper 用该路径，Fabric 用 config/resource-pack-service/community
  # 社区包在合成时的层序偏移；具体包的 priority 会叠加在它上面
  priority: 0
  # 服务端 Minecraft 版本（如 1.21.8）；空串表示不额外限制版本，由各包的 minecraft 范围决定
  minecraft: ""
  # 服务端资源包格式；留空沿用 merge.pack-format 的具体数字，0 表示不按格式过滤
  pack-format: ""
  # 远程索引：从 GitHub Pages 拉取社区包清单，只下载本机已安装插件对应的包
  remote:
    enabled: false
    index-url: "https://nekomc-official.github.io/Resource-Pack-Service/community-index.json"
    interval-minutes: 60
    timeout-ms: 30000
    max-pack-bytes: 67108864
    require-https: true
    pin-sha1: ""

sources:
  - id: "bettermodel/base"
    enabled: true
    path: "plugins/BetterModel/build.zip"
    priority: -100
    namespaces:
      - "bettermodel"

watch:
  enabled: true
  interval-seconds: 60

push:
  # none 只落盘；notify 提示玩家点击下载；force 直接强制重推
  mode: "notify"
  notify-message: "<gold>资源包已更新，<click:run_command:'/rps push'><u>点这里重新下载</u></click></gold>"
